name: Guardar bibliotecas visuales para uso local
on:
  push:
    paths:
      - '.github/workflows/recursos-locales.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalar-recursos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Obtener recursos locales
        shell: bash
        run: |
          set -e
          mkdir -p public/vendor/{bootstrap,datatables,fontawesome/css,fontawesome/webfonts,jquery,chartjs,sweetalert2,sheetjs,jspdf}
          get() {
            curl -fLsS --retry 3 --max-time 90 "$1" -o "$2"
            test -s "$2"
          }
          get "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" "public/vendor/bootstrap/bootstrap.min.css"
          get "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" "public/vendor/bootstrap/bootstrap.bundle.min.js"
          get "https://code.jquery.com/jquery-3.7.0.js" "public/vendor/jquery/jquery.min.js"
          get "https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" "public/vendor/datatables/dataTables.bootstrap5.min.css"
          get "https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js" "public/vendor/datatables/jquery.dataTables.min.js"
          get "https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js" "public/vendor/datatables/dataTables.bootstrap5.min.js"
          get "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" "public/vendor/fontawesome/css/all.min.css"
          for f in fa-brands-400 fa-regular-400 fa-solid-900 fa-v4compatibility; do
            for ext in woff2 ttf; do
              curl -fLsS --retry 2 --max-time 60 \
                "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/webfonts/$f.$ext" \
                -o "public/vendor/fontawesome/webfonts/$f.$ext" || rm -f "public/vendor/fontawesome/webfonts/$f.$ext"
            done
          done
          get "https://cdn.jsdelivr.net/npm/chart.js" "public/vendor/chartjs/chart.js"
          get "https://cdn.jsdelivr.net/npm/sweetalert2@11" "public/vendor/sweetalert2/sweetalert2.min.js"
          get "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" "public/vendor/jspdf/jspdf.umd.min.js"
          get "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" "public/vendor/jspdf/jspdf.plugin.autotable.min.js"
          curl -fLsS --retry 2 --max-time 90 \
            "https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js" \
            -o "public/vendor/sheetjs/xlsx.full.min.js" || rm -f "public/vendor/sheetjs/xlsx.full.min.js"

      - name: Reemplazar solo referencias externas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rutas = {
            "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css": "/vendor/bootstrap/bootstrap.min.css",
            "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js": "/vendor/bootstrap/bootstrap.bundle.min.js",
            "https://code.jquery.com/jquery-3.7.0.js": "/vendor/jquery/jquery.min.js",
            "https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css": "/vendor/datatables/dataTables.bootstrap5.min.css",
            "https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js": "/vendor/datatables/jquery.dataTables.min.js",
            "https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js": "/vendor/datatables/dataTables.bootstrap5.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css": "/vendor/fontawesome/css/all.min.css",
            "https://cdn.jsdelivr.net/npm/chart.js": "/vendor/chartjs/chart.js",
            "https://cdn.jsdelivr.net/npm/sweetalert2@11": "/vendor/sweetalert2/sweetalert2.min.js",
            "https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js": "/vendor/sheetjs/xlsx.full.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js": "/vendor/jspdf/jspdf.umd.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js": "/vendor/jspdf/jspdf.plugin.autotable.min.js",
          }
          for php in Path("app/views").rglob("*.php"):
            original = php.read_text(encoding="utf-8")
            nuevo = original
            for url,ruta in rutas.items():
              if Path("public"+ruta).is_file():
                nuevo = nuevo.replace(url,ruta)
            if nuevo != original:
              php.write_text(nuevo,encoding="utf-8")
          PY
      - name: Verificar recursos principales
        run: |
          test -s public/vendor/bootstrap/bootstrap.min.css
          test -s public/vendor/bootstrap/bootstrap.bundle.min.js
          test -s public/vendor/jquery/jquery.min.js
          test -s public/vendor/fontawesome/webfonts/fa-solid-900.woff2
          test -s public/vendor/chartjs/chart.js
      - name: Guardar recursos locales sin modificar el diseño
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/vendor app/views
          if ! git diff --cached --quiet; then
            git commit -m 'Guardar recursos CSS JS y fuentes locales del dashboard'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
