name: Verificar PHP - Proyecto EFSRT
on:
  push:
    paths:
      - 'app/controllers/InventarioController.php'
      - 'app/controllers/ReservasController.php'
      - 'app/models/Reserva.php'
      - 'app/models/Producto.php'
      - 'app/views/inventario/productos.php'
      - 'app/views/pos/index.php'
      - 'app/views/reservas/index.php'
      - 'app/views/inc/navbar.php'
      - 'app/models/RevisionSemana05.php'
      - 'app/controllers/RevisionController.php'
      - 'app/views/revision/index.php'
      - 'app/models/Venta.php'
      - 'tests/semana05_smoke.php'
      - 'app/models/Portal.php'
      - 'app/controllers/PortalController.php'
      - 'app/views/portal/index.php'
      - 'tests/portal_smoke.php'
      - 'app/models/RutinaRecomendada.php'
      - 'app/controllers/RutinasController.php'
      - 'app/views/rutinas/index.php'
      - 'app/models/PagoSuscripcion.php'
      - 'app/controllers/PagosController.php'
      - 'app/views/pagos/index.php'
      - 'app/views/pagos/comprobante.php'
      - 'app/models/Asistencia.php'
      - 'app/controllers/AsistenciaController.php'
      - 'app/models/Dashboard.php'
      - '.github/workflows/semana05-php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Revisar sintaxis PHP
        shell: bash
        run: |
          set -e
          php -l app/controllers/InventarioController.php
          php -l app/controllers/ReservasController.php
          php -l app/models/Reserva.php
          php -l app/models/Producto.php
          php -l app/views/inventario/productos.php
          php -l app/views/pos/index.php
          php -l app/views/reservas/index.php
          php -l app/views/inc/navbar.php
          php -l app/models/RevisionSemana05.php
          php -l app/controllers/RevisionController.php
          php -l app/views/revision/index.php
          php -l app/models/Venta.php
          php -l app/models/Portal.php
          php -l app/controllers/PortalController.php
          php -l app/views/portal/index.php
          php -l tests/portal_smoke.php
          php -l app/models/RutinaRecomendada.php
          php -l app/controllers/RutinasController.php
          php -l app/views/rutinas/index.php
          php -l app/models/PagoSuscripcion.php
          php -l app/controllers/PagosController.php
          php -l app/views/pagos/index.php
          php -l app/views/pagos/comprobante.php
          php -l app/models/Asistencia.php
          php -l app/controllers/AsistenciaController.php
          php -l app/models/Dashboard.php
          php -l tests/semana05_smoke.php

  integracion-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: gym_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP 8.2 y extensión MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo, gd
      - name: Comprobar reservas, fotos y control de stock
        run: php tests/semana05_smoke.php
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_USER: root
          DB_TEST_PASS: testroot
          DB_TEST_NAME: gym_system

  portal-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: gym_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo
      - name: Probar sincronización portal-dashboard
        run: php tests/portal_smoke.php
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_USER: root
          DB_TEST_PASS: testroot
          DB_TEST_NAME: gym_system
