name: Verificar PHP - Proyecto EFSRT
on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'public/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/semana05-php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Revisar sintaxis de todo el código PHP
        shell: bash
        run: |
          set -e
          find app/controllers app/models app/views public tests             -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  integracion-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: gym_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP 8.2 y extensión MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, fileinfo, gd
      - name: Comprobar reservas, fotos y control de stock
        run: php tests/semana05_smoke.php
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_USER: root
          DB_TEST_PASS: testroot
          DB_TEST_NAME: gym_system

  portal-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: gym_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo
      - name: Probar sincronización portal-dashboard
        run: php tests/portal_smoke.php
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_USER: root
          DB_TEST_PASS: testroot
          DB_TEST_NAME: gym_system

  estructura-recursos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estructura del sistema y bibliotecas offline
        shell: bash
        run: |
          set -e
          for path in \
            app/controllers/PortalController.php \
            app/controllers/ApiController.php \
            app/controllers/ReservasController.php \
            app/controllers/PagosController.php \
            app/controllers/RutinasController.php \
            app/controllers/EntrenadorController.php \
            app/controllers/AsistenciaController.php \
            app/models/Reserva.php \
            app/models/PagoSuscripcion.php \
            app/models/TokenApi.php \
            app/views/portal/index.php \
            app/views/home/index.php \
            app/views/rutinas/index.php \
            app/views/entrenador/index.php \
            app/views/pagos/index.php \
            public/vendor/bootstrap/bootstrap.min.css \
            public/vendor/bootstrap/bootstrap.bundle.min.js \
            public/vendor/jquery/jquery.min.js \
            public/vendor/chartjs/chart.js \
            public/vendor/fontawesome/webfonts/fa-solid-900.woff2 \
            public/img/logo_empresa.png \
            docs/VERIFICACION_EFSRT_SEMANAS_01_A_11.md \
            scripts/respaldo_efsrt.ps1
          do
            test -s "$path" || { echo "FALTA: $path"; exit 1; }
          done
          echo "Estructura esencial: correcta"
